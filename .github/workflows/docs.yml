name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for the build, plus what deploy-pages needs to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deployments instead of cancelling one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build the documentation
        # -W turns warnings into errors, so a broken cross-reference or a
        # page missing from the toctree fails the build instead of shipping.
        run: python -m sphinx -b html -W docs docs/_build/html

      - name: Disable Jekyll processing
        # Sphinx writes _static/ and _sources/; the leading underscore would
        # make Jekyll skip them. Harmless belt and braces for Pages.
        run: touch docs/_build/html/.nojekyll

      - name: Upload the Pages artifact
        # Only what gets deployed is worth uploading; pull requests stop
        # at the build check above.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests are build-checked only; publishing happens from main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
